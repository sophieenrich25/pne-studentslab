<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LIST OF SPECIES IN THE BROWSER</title>
</head>
<body style="background-color: lavender;">
    <p>The total number of species in Ensembl is: {{ context.total_species }}</p>
    <p>The limit you have selected is: {{ context.limit_value }}</p>
    <p>The names of the species are:</p>
    <ul>
        {% for name in context.species_list %}
        <li>{{ name }}</li>
        {% endfor %}
    </ul>

</body>
</html>
